<!doctype html><!-- Source of the design-review screenshots: 0.png is this page, 1.png is #filled, both at 1280x800. -->
<html><head><meta charset="utf-8"><style>
body{margin:0;font:15px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;background:#F6F5F2;color:#1B1B1A}
.bar{display:flex;justify-content:space-between;padding:18px 40px;background:#fff;border-bottom:1px solid #E6E3DC;font-weight:700;letter-spacing:.02em}
.bar span{font-weight:400;color:#6B6A66;font-size:13px}
main{display:grid;grid-template-columns:1fr 340px;gap:32px;max-width:1080px;margin:32px auto;padding:0 40px}
.card{background:#fff;border:1px solid #E6E3DC;border-radius:12px;padding:28px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#6B6A66;margin:0 0 20px;font-size:13px}
label{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
input{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border:1px solid #CFCBC2;border-radius:8px}
.bad input{border-color:#B42318;box-shadow:0 0 0 3px #FDECEA}
.err{color:#B42318;font-size:13px;margin-top:6px}
.row{display:grid;grid-template-columns:2fr 1fr;gap:16px}
button{margin-top:24px;width:100%;padding:13px;border:0;border-radius:8px;background:#1B1B1A;color:#fff;font:600 15px inherit}
.line{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}.tot{border-top:1px solid #E6E3DC;padding-top:12px;font-weight:700}
.steps{font-size:12px;color:#6B6A66;margin-bottom:14px}.steps b{color:#1B1B1A}
</style></head><body>
<div class="bar">STOREFRONT<span>Secure checkout</span></div>
<main><div class="card"><div class="steps"><b>Address</b> · Shipping · Payment</div>
<h1>Shipping address</h1><p class="sub">Where should we send your order?</p>
<div id="f"></div><button>Continue to shipping</button></div>
<div class="card"><h1 style="font-size:17px">Order summary</h1>
<div class="line"><span>Canvas tote × 1</span><span>$38.00</span></div>
<div class="line"><span>Ceramic mug × 2</span><span>$44.00</span></div>
<div class="line"><span>Shipping</span><span>Calculated next</span></div>
<div class="line tot"><span>Subtotal</span><span>$82.00</span></div></div></main>
<script>
const filled = location.hash === "#filled";
const f = (l, v, e) => `<div class="${e && !filled ? "bad" : ""}"><label>${l}</label><input value="${filled ? v[1] : v[0]}">${e && !filled ? `<div class="err">${e}</div>` : ""}</div>`;
document.getElementById("f").innerHTML = f("Full name", ["Sam Rivera", "Sam Rivera"]) +
  f("Address", ["", "12 Main St"], "Enter a street address.") +
  `<div class="row">${f("City", ["Springfield", "Springfield"])}${f("ZIP code", ["100", "10001"], "Enter a 5-digit ZIP code, like 10001.")}</div>`;
</script></body></html>
