<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task</title>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css">
<link rel="stylesheet" href="drawer.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header.top { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  header.top a { font-size: 12px; color: var(--accent); }
  header.top a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header.top h1 a { font-size: inherit; color: var(--muted); text-decoration: none; }
  header.top h1 a:hover { color: var(--accent); }
  .task { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 30vw, 460px);
          grid-template-rows: minmax(0, 1fr); min-height: 0; }
  #docs { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  #docs #doc { padding: 20px 32px 48px; }
  #docs #doc > * { max-width: 920px; }
  #drawer { background: var(--bg); min-height: 0; overflow-y: auto; }
  #drawer header { padding: 24px 20px; }
  #drawer #d-title { font-size: 16px; }
  #drawer #run, #drawer #actions { padding: 24px 20px; }
  /* Summary / Docs / Workflow / Diff tabs; the document chips sit under Docs */
  .views { display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); flex: none; }
  .views button { font: 600 11px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-transform: uppercase;
                  letter-spacing: .08em; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent;
                  padding: 14px 0 12px; cursor: pointer; transition: color .15s, border-color .15s; }
  .views button:hover { color: var(--ink); }
  .views button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #summary-view { flex: 1; min-height: 0; overflow: auto; padding: 20px 32px 48px; }
  #summary-view > * { max-width: 920px; }
  #summary-view h2 { font-size: 15px; margin: 24px 0 6px; }
  #summary-view h2:first-child { margin-top: 0; }
  #summary-view .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #summary-view .blocking { color: var(--human); font-weight: 600; }
  #questions-view { flex: 1; min-height: 0; overflow: auto; padding: 20px 32px 48px; }
  #questions-view > * { max-width: 720px; }
  #questions-view fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; display: grid; gap: 8px; }
  #questions-view legend { font-weight: 600; padding: 0 4px; }
  #questions-view label { display: flex; gap: 8px; align-items: center; }
  #questions-view textarea { font: 13px/1.4 inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                             border-radius: 6px; padding: 8px; min-height: 80px; resize: vertical; }
  #questions-view button { font: 600 13px/1 inherit; padding: 9px 14px; border-radius: 6px; cursor: pointer;
                           border: 1px solid var(--ink); background: var(--ink); color: var(--panel); }
  #questions-view button:disabled { opacity: .5; cursor: progress; }
  #questions-view :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #questions-view .err { color: var(--human); }
  #docs-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #flow-view { flex: 1; min-height: 0; overflow: auto; padding: 12px 24px; }
  #diff-view { flex: 1; min-height: 0; overflow: auto; padding: 16px 24px 48px; }
  #summary-view[hidden], #questions-view[hidden], #docs-view[hidden], #flow-view[hidden], #diff-view[hidden] { display: none; }
  /* the diff: diff2html dressed as GitHub's. Its line numbers are position:absolute, which ignores #diff-view's
     scroll, so they go back to plain table cells; a changed line is green/red like any other, never yellow. */
  #diff-view {
    --d2h-bg-color: #fff; --d2h-border-color: #d1d9e0; --d2h-dim-color: #59636e; --d2h-line-border-color: transparent;
    --d2h-file-header-bg-color: #f6f8fa; --d2h-file-header-border-color: #d1d9e0; --d2h-moved-label-color: #0969da;
    --d2h-ins-bg-color: #e6ffec; --d2h-ins-highlight-bg-color: #abf2bc; --d2h-ins-label-color: #1a7f37; --d2h-ins-num: #ccffd8;
    --d2h-del-bg-color: #ffebe9; --d2h-del-highlight-bg-color: rgba(255,129,130,.4); --d2h-del-label-color: #d1242f; --d2h-del-num: #ffd7d5;
    --d2h-change-ins-color: var(--d2h-ins-bg-color); --d2h-change-del-color: var(--d2h-del-bg-color); --d2h-change-label-color: #59636e;
    --d2h-info-bg-color: #ddf4ff; --d2h-info-border-color: transparent; --d2h-info-num: #b6e3ff;
  }
  @media (prefers-color-scheme: dark) {
    #diff-view {
      --d2h-bg-color: #0d1117; --d2h-border-color: #3d444d; --d2h-dim-color: #9198a1;
      --d2h-file-header-bg-color: #151b23; --d2h-file-header-border-color: #3d444d; --d2h-moved-label-color: #4493f8;
      --d2h-ins-bg-color: rgba(46,160,67,.15); --d2h-ins-highlight-bg-color: rgba(46,160,67,.4); --d2h-ins-label-color: #3fb950; --d2h-ins-num: rgba(63,185,80,.3);
      --d2h-del-bg-color: rgba(248,81,73,.1); --d2h-del-highlight-bg-color: rgba(248,81,73,.4); --d2h-del-label-color: #f85149; --d2h-del-num: rgba(248,81,73,.3);
      --d2h-change-label-color: #9198a1; --d2h-info-bg-color: rgba(56,139,253,.1); --d2h-info-num: rgba(56,139,253,.3);
    }
  }
  #diff-view .d2h-wrapper { color: var(--ink); }
  #diff-view .d2h-file-wrapper, #diff-view .d2h-file-list-wrapper { border: 1px solid var(--d2h-border-color); border-radius: 6px;
    overflow: clip; margin-bottom: 16px; background: var(--d2h-bg-color); }
  #diff-view .d2h-file-list-header { padding: 8px 16px; font-size: 13px; background: var(--d2h-file-header-bg-color); }
  #diff-view .d2h-file-list { border-top: 1px solid var(--d2h-border-color); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #diff-view .d2h-file-list > li { padding: 4px 16px; border-color: var(--d2h-border-color); }
  #diff-view .d2h-file-header { height: auto; padding: 8px 16px; align-items: center; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    position: sticky; top: -16px; z-index: 1; }  /* top: #diff-view's padding, so the header pins flush */
  #diff-view .d2h-tag { display: none; }
  #diff-view .d2h-diff-table { font: 12px/20px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  #diff-view .d2h-code-linenumber { position: static; display: table-cell; width: 1%; white-space: nowrap; border: 0; vertical-align: top;
    direction: ltr; }  /* diff2html's rtl puts the old line number in the new column */
  #diff-view .line-num1, #diff-view .line-num2 { float: none; display: inline-block; vertical-align: top; width: auto; min-width: 50px; padding: 0 10px; text-align: right; }
  #diff-view .d2h-diff-table td { padding: 0; }
  #diff-view .d2h-code-line { display: block; padding: 0 10px; width: auto; }
  #diff-view .d2h-code-line-prefix { display: inline-block; width: 1.5ch; }
  #diff-view .d2h-code-line > span { vertical-align: top; }
  #diff-view .d2h-code-line-ctn { width: auto; }  /* diff2html's 100% plus the +/- prefix overflows every line */  /* baseline-aligned inline-blocks would make every row taller than 20px */
  #diff-view .d2h-code-line del, #diff-view .d2h-code-line ins { border-radius: 0; margin: 0; }
  #diff-view .d2h-code-linenumber.d2h-ins { background: var(--d2h-ins-num); }
  #diff-view .d2h-code-linenumber.d2h-del { background: var(--d2h-del-num); }
  #diff-view .d2h-code-linenumber.d2h-info { background: var(--d2h-info-num); }
  #diff-view td.d2h-info { color: var(--d2h-dim-color); }
  #flow { display: block; width: 100%; height: 100%; }  /* the viewBox scales to fit the panel, no scrolling */
  #msg { color: var(--muted); padding: 24px; text-align: center; grid-column: 1 / -1; grid-row: 1; z-index: 1; background: var(--bg); }
  /* the flow graph */
  #flow text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  #flow .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  #flow .edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  #flow .fwd { stroke-dasharray: 1; }  /* pathLength=1: one dash is the whole path, so the draw-in is a dashoffset */
  #flow .fwd.pending { stroke: var(--line); }
  #flow .loop { stroke-dasharray: 5 4; stroke: var(--pending); stroke-opacity: .55; }
  #flow .fan { stroke: var(--human); stroke-opacity: .22; stroke-width: 1; }
  /* the route the task took: forward edges, loop-backs and its escalation */
  #flow .edge.taken { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2.25; }
  #flow .loop.taken { stroke-dasharray: none; }
  #flow .fan.taken { stroke: var(--human); stroke-width: 1.75; }
  #flow .elabel { font-size: 10px; fill: var(--muted); }
  #flow .count rect { fill: var(--accent-bg); stroke: var(--accent); }
  #flow .count text { font: 600 9px ui-monospace, Menlo, monospace; fill: var(--accent); }
  #flow .node { transform-box: fill-box; transform-origin: center; }
  #flow .box { fill: var(--panel); stroke: var(--muted); stroke-width: 1.25; }
  #flow .node.pending .box { stroke-dasharray: 4 3; stroke: var(--pending); }
  #flow .node.done .box { fill: var(--line); stroke: var(--line); }
  #flow .node.current .box { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1.5; }
  #flow .node.nh.current .box { fill: var(--human-bg); stroke: var(--human); }
  #flow .label { font-size: 13px; font-weight: 600; }
  #flow .cap { font-size: 10px; fill: var(--muted); }
  #flow .node.done .label, #flow .node.pending .label { fill: var(--muted); }
  #flow .icon { color: var(--muted); fill: none; stroke: currentColor; stroke-width: 1.4; }
  #flow .icon.solid { fill: currentColor; stroke: none; }
  #flow text.icon { fill: currentColor; stroke: none; font: 600 9px ui-monospace, Menlo, monospace; }
  #flow .node.current .icon { color: var(--accent); }
  #flow .node.nh.current .icon, #flow .node.nh.current .label { color: var(--human); fill: var(--human); }
  #flow .node.nh.current .icon:not(.solid) { fill: none; }
  #flow .state { font-size: 12px; font-weight: 700; fill: var(--muted); }
  #flow .node.done .state { fill: var(--pass); }
  #flow .node.current .state { fill: var(--accent); }
  #flow .node.nh.current .state { fill: var(--human); }
  #flow .node.left .box { stroke: var(--human); stroke-width: 1.5; }  /* the stage it escalated from */
  #flow .node.left .state { fill: var(--human); }
  #flow .note { font-size: 10.5px; fill: var(--human); }
  #flow .vchip rect { fill: var(--panel); stroke: var(--pending); }
  #flow .vchip text { font-size: 9.5px; fill: var(--pending); }
  #flow .vchip.PASS rect { fill: var(--pass-bg); stroke: var(--pass-line); }
  #flow .vchip.PASS text { fill: var(--pass); }
  #flow .vchip.CHANGES rect { fill: var(--changes-bg); stroke: var(--changes-line); }
  #flow .vchip.CHANGES text { fill: var(--changes); }
  #flow .vchip.skipped { opacity: .45; }
  #flow .vchip.skipped rect { stroke-dasharray: 3 2; }
  #flow .vchip.skipped text { text-decoration: line-through; }
  #flow .arrow { fill: var(--muted); }
  #flow .arrow.on { fill: var(--accent); }
  #flow .arrow.nh { fill: var(--human); }
  #ring rect { fill: none; stroke: var(--accent); stroke-width: 2.5; transform-box: fill-box; transform-origin: center; }
  #ring.nh rect { stroke: var(--human); }
  #ring.off { opacity: 0; }
  @media (min-width: 900px) { body { height: 100vh; overflow: hidden; } }
  @media (max-width: 899px) {
    .task { grid-template-columns: 1fr; grid-template-rows: none; }
    #drawer { order: -1; border-bottom: 1px solid var(--line); }  /* actions first on a narrow screen */
    #docs { border-right: 0; }
    #docs #doc { padding: 16px; }
    #flow { height: auto; }
  }
</style>
</head>
<body>
<header class="top"><h1><a href="dashboard.html">Board</a> / <span id="w-id"></span></h1>
  <span id="status">connecting…</span></header>
<div class="task">
  <p id="msg" hidden></p>
  <section id="docs" aria-label="Task details">
    <nav class="views" role="tablist">
      <button role="tab" id="v-summary" aria-controls="summary-view" data-view="summary">Summary</button>
      <button role="tab" id="v-questions" aria-controls="questions-view" data-view="questions">Questions</button>
      <button role="tab" id="v-docs" aria-controls="docs-view" data-view="docs">Docs</button>
      <button role="tab" id="v-flow" aria-controls="flow-view" data-view="workflow">Workflow</button>
      <button role="tab" id="v-diff" aria-controls="diff-view" data-view="diff">Diff</button>
    </nav>
    <div id="summary-view" role="tabpanel" aria-labelledby="v-summary"></div>
    <div id="questions-view" role="tabpanel" aria-labelledby="v-questions" hidden></div>
    <div id="docs-view" role="tabpanel" aria-labelledby="v-docs" hidden></div>
    <div id="flow-view" role="tabpanel" aria-labelledby="v-flow" hidden>
      <svg id="flow" role="img" aria-label="Loading" viewBox="0 0 720 698"></svg>
      <ol id="flow-list" class="sr-only"></ol>
    </div>
    <div id="diff-view" role="tabpanel" aria-labelledby="v-diff" hidden></div>
  </section>
  <aside id="drawer" aria-label="Task"></aside>
</div>

<!-- defer keeps this order (marked, motion, drawer.js, flow.js); the inline script starts on DOMContentLoaded, after them -->
<script defer src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script defer src="drawer.js"></script>
<script defer src="flow.js"></script>
<script>
const jobId = new URLSearchParams(location.search).get("id") || "";
document.title = jobId;
document.getElementById("w-id").textContent = jobId;

let last = "";
async function poll() {
  const status = document.getElementById("status"), msg = document.getElementById("msg");
  try {
    const r = await fetch(`jobs/${encodeURIComponent(jobId)}/job.json`, { cache: "no-store" });
    if (r.status === 404) {
      msg.hidden = false; msg.textContent = `No job “${jobId}”.`;
      status.className = "off"; status.textContent = "no such job";
      last = "";
      return;
    }
    const text = r.ok ? await r.text() : "";
    const j = JSON.parse(text);  // a half-written job.json throws; the next poll gets it
    if (text !== last) {
      const first = !last;
      last = text; jobs = [j]; msg.hidden = true;
      draw(j, first);
      document.title = `${j.id} · ${j.title || "task"}`;
      openJob(j.id, openId === j.id);
      loadSummary(j);
      loadQuestions(j);
      if (first && !location.hash && j.stage === "questions") showView("questions");
      if (!document.getElementById("diff-view").hidden) loadDiff();  // a new commit changes job.json too
    }
    status.className = ""; status.textContent = `live · ${new Date().toLocaleTimeString()}`;
  } catch (e) { status.className = "off"; status.textContent = "factory server unreachable"; }
}

// The task at a glance, from job.json and the agents' documents: what was asked, what was built, how it was judged.
const section = (text, h) => text.split(/^## /m).find(s => s.startsWith(h + "\n"))?.slice(h.length + 1).trim() || "";
let summaryRender = 0;
async function loadSummary(j) {
  const n = ++summaryRender;  // a later render wins
  const get = p => fetch(`jobs/${encodeURIComponent(j.id)}/${p}`, { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => "");
  const [ticket, spec, build, decision] = await Promise.all(["ticket.md", "spec.md", "build.md", "decision.md"].map(get));
  if (n !== summaryRender) return;
  const [verdict = "", ...rest] = decision.trim().split("\n");
  const reason = rest.join("\n").trim().split(/\n\s*\n/)[0];
  const reviews = REVIEWERS.filter(r => j.reviews?.[r]);
  const findings = REVIEWERS.flatMap(r => (j.findings?.[r] || []).map(f =>
    `<li>${f.blocking ? `<span class="blocking">Blocking</span> · ` : ""}<strong>${esc(r)}</strong>: ${esc(f.text)}</li>`));
  const part = (title, body) => body ? `<h2>${title}</h2>${body}` : "";
  document.getElementById("summary-view").innerHTML = [
    // a Linear ticket: its title, link and description (run.py import_linear writes ticket.md)
    part("Request", ticket ? md(ticket.replace(/^# .*\n/, "")) : j.feature ? `<p>${esc(j.feature)}</p>` : ""),
    part("Goal", section(spec, "Goal") && md(section(spec, "Goal"))),
    part("What changed", section(build, "Summary") && md(section(build, "Summary"))),
    part("Reviews", reviews.length ? `<div class="chips">${reviews.map(r =>
      `<span class="chip ${esc(j.reviews[r])}">${esc(r)} · ${esc(j.reviews[r])}</span>`).join("")}</div>` : ""),
    part("Findings", findings.length ? `<ul>${findings.join("")}</ul>` : ""),
    part("Decision", verdict && `<p><strong>${esc(verdict)}</strong></p>${reason ? md(reason) : ""}`),
  ].join("") || `<p class="meta">Nothing yet: the spec is still being written.</p>`;
}

// The spec writer's open questions (questions.json) as a form; earlier answers (spec-answers.md) below it.
let questionsKey = "";
async function loadQuestions(j) {
  const get = p => fetch(`jobs/${encodeURIComponent(j.id)}/${p}`, { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => "");
  const [raw, answers] = await Promise.all([j.stage === "questions" ? get("questions.json") : "", get("spec-answers.md")]);
  const key = JSON.stringify([j.stage, raw, answers]);
  if (key === questionsKey) return;  // never wipe answers being typed
  questionsKey = key;
  let qs = [];
  try { qs = raw ? JSON.parse(raw) : []; } catch (e) { qs = []; }
  const field = (q, i) => {
    const name = `q${i}`, opts = Array.isArray(q.options) ? q.options : [];
    const input = q.type === "text" ? `<textarea name="${name}" aria-label="${esc(q.question)}"></textarea>`
      : opts.map(o => `<label><input type="${q.type === "multi" ? "checkbox" : "radio"}" name="${name}" value="${esc(o)}"> ${esc(o)}</label>`).join("");
    return `<fieldset><legend>${esc(q.question)}</legend>${q.type === "multi" ? `<p class="meta">Select all that apply.</p>` : ""}${input}</fieldset>`;
  };
  const view = document.getElementById("questions-view");
  view.innerHTML = (qs.length ? `<form id="answers">${qs.map(field).join("")}
      <button type="submit">Send to spec writer</button> <span class="err" role="alert"></span></form>`
    : `<p class="meta">${j.stage === "questions" ? "Loading questions…" : "No open questions from the spec writer."}</p>`)
    + (answers ? `<h2>Earlier answers</h2>${md(answers)}` : "");
  const form = document.getElementById("answers");
  if (!form) return;
  form.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(form), err = form.querySelector(".err"), btn = form.querySelector("button");
    const text = qs.map((q, i) => {
      const vals = fd.getAll(`q${i}`).map(v => String(v).trim()).filter(Boolean);
      return `### ${q.question}\n${vals.length ? vals.map(v => q.type === "multi" ? `- ${v}` : v).join("\n") : "(no answer)"}`;
    }).join("\n\n");
    btn.disabled = true; err.textContent = "";
    const r = await fetch(`api/jobs/${encodeURIComponent(j.id)}/answer`, {
      method: "POST", headers: { "X-Factory": "1", "Content-Type": "application/json" },
      body: JSON.stringify({ text }), cache: "no-store" }).catch(() => null);
    if (r?.ok) { btn.textContent = "Sent"; return poll(); }
    err.textContent = (await r?.json().catch(() => null))?.error || "Couldn't send. Is factory/server.py running?";
    btn.disabled = false;
  };
}

// The branch's changes against develop, GitHub style (diff2html escapes the code).
async function loadDiff() {
  const view = document.getElementById("diff-view");
  try {
    const r = await fetch(`api/jobs/${encodeURIComponent(jobId)}/diff`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);  // e.g. a server.py started before /diff existed
    const { diff, omitted = [] } = await r.json();
    const more = omitted.length ? `<p class="note">Too large to show here, see the PR: ${omitted.map(f => `<code>${esc(f)}</code>`).join(", ")}</p>` : "";
    view.innerHTML = !diff && !more ? `<p class="meta">No changes yet.</p>` : more + (!diff ? "" : window.Diff2Html
      ? Diff2Html.html(diff, { drawFileList: true, matching: "lines", outputFormat: "line-by-line", colorScheme: "light" })  // light: the #diff-view tokens handle dark mode
      : `<pre>${esc(diff)}</pre>`);
  } catch (e) { view.innerHTML = `<p class="meta">No diff: restart factory/server.py (it needs the version with /api/jobs/…/diff).</p>`; }
}

// Summary, Questions, Docs, Workflow or Diff; the URL hash keeps the choice across reloads and links (job.html?id=…#workflow).
const VIEWS = ["summary", "questions", "docs", "workflow", "diff"];
function showView(name) {
  document.querySelectorAll(".views [role=tab]").forEach(b => {
    const on = b.dataset.view === name;
    b.setAttribute("aria-selected", on);
    document.getElementById(b.getAttribute("aria-controls")).hidden = !on;
  });
  history.replaceState(null, "", name === "summary" ? location.pathname + location.search : "#" + name);
  if (name === "diff") loadDiff();
}

// A closed task has nothing left to act on: back to the board.
function closeDrawer() { location.href = "dashboard.html"; }

document.addEventListener("DOMContentLoaded", () => {  // drawer.js has run by then
  mountDrawer();
  build();
  showView(VIEWS.find(v => "#" + v === location.hash) || "summary");
  document.querySelector(".views").onclick = e => e.target.dataset.view && showView(e.target.dataset.view);
  poll(); setInterval(poll, 2000);
});
</script>
</body>
</html>
